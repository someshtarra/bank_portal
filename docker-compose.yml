version: '3.8'

services:
  # MySQL Database Service
  database:
    image: mysql:8.0
    container_name: bank_portal_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bank_portal_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
      - mysql_data:/var/lib/mysql
    networks:
      - bank_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Express REST API Backend
  backend:
    build: ./backend
    container_name: bank_portal_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: bank_portal_db
      JWT_SECRET: super_secret_jwt_key_banking_portal_2026_antigravity
      JWT_EXPIRES_IN: 24h
      CLIENT_URL: http://localhost:5173
    depends_on:
      database:
        condition: service_healthy
    networks:
      - bank_network

  # React Vite Frontend SPA
  frontend:
    build: ./frontend
    container_name: bank_portal_frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - bank_network

networks:
  bank_network:
    driver: bridge

volumes:
  mysql_data:
